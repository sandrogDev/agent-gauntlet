name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  demo-eval:
    name: Demo evaluation (offline)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: gauntlet validate examples/suites/airline_support.yaml
      # The naive demo agent is *meant* to fail; this job shows the reporting
      # path end to end and publishes the HTML report as a build artifact.
      - run: |
          gauntlet run examples/suites/airline_support.yaml \
            --provider python:examples/agents/naive_agent.py \
            --html gauntlet-report.html --json gauntlet-run.json
      - uses: actions/upload-artifact@v4
        with:
          name: gauntlet-report
          path: |
            gauntlet-report.html
            gauntlet-run.json

  # Live-model evaluation runs only when an API key is configured, so forks and
  # PRs from contributors never need secrets for CI to stay green.
  live-eval:
    name: Live evaluation (Claude)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Skip without a key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY not set; skipping live evaluation."
      - if: env.ANTHROPIC_API_KEY != ''
        run: pip install -e ".[anthropic]"
      - name: Restore previous run (baseline)
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/cache/restore@v4
        with:
          path: .gauntlet
          key: gauntlet-runs-${{ github.sha }}
          restore-keys: gauntlet-runs-
      - if: env.ANTHROPIC_API_KEY != ''
        run: |
          BASELINE=""
          if ls .gauntlet/runs/*.json >/dev/null 2>&1; then BASELINE="--baseline latest --fail-on-regression"; fi
          gauntlet run examples/suites/airline_support.yaml \
            --provider anthropic:claude-sonnet-5-5 \
            --concurrency 4 --fail-on-critical $BASELINE \
            --html gauntlet-live.html
      - if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/cache/save@v4
        with:
          path: .gauntlet
          key: gauntlet-runs-${{ github.sha }}
      - if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-live-report
          path: gauntlet-live.html
